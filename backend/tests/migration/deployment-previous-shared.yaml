server:
  hostname: "previous-server"
  public_url: "http://previous-server:8090"
  port: 8090
  http_only: true
  identifier: "migration-deployment"
  security:
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

database:
  config: &shared_database
    type: postgres
    postgres:
      hostname: postgres
      port: 5432
      name: thunderid
      username: migration_user
      password: migration_password
      sslmode: disable

  runtime_transient: *shared_database
  entity: *shared_database
  runtime_persistent: *shared_database

log:
  level: info
