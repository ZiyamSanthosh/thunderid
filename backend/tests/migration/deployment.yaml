server:
  hostname: "migration-runner"
  port: 8090
  http_only: true
  identifier: "migration-deployment"
  system_ou_id: "01900000-0000-7000-8000-000000000001"
  security:
    direct_auth_secret: "file://config/secrets/direct_auth_secret"

database:
  config:
    type: postgres
    postgres:
      hostname: postgres
      port: 5432
      name: configdb
      username: migration_user
      password: migration_password
      sslmode: disable

  runtime_transient:
    type: postgres
    postgres:
      hostname: postgres
      port: 5432
      name: runtime_transient
      username: migration_user
      password: migration_password
      sslmode: disable

  entity:
    type: postgres
    postgres:
      hostname: postgres
      port: 5432
      name: entitydb
      username: migration_user
      password: migration_password
      sslmode: disable

  runtime_persistent:
    type: postgres
    postgres:
      hostname: postgres
      port: 5432
      name: runtime_persistent
      username: migration_user
      password: migration_password
      sslmode: disable

migration:
  startup_compatibility_check: true

log:
  level: info
